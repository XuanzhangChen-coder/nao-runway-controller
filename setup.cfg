[metadata]
name = nao-runway-controller
version = 1.0.0
description = Framework-independent runway centerline controller reconstructed from a NAO demo
long_description = file: README.md
long_description_content_type = text/markdown
license = Apache-2.0
author = Xuanzhang Chen

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
include_package_data = True

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    nao-runway-demo = runway_controller.demo:main
